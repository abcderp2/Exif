name: Browser audit

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false

      - name: Run unit checks
        run: npm run verify

      - name: Install audit browser
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.55.0 > /tmp/npm-audit-install.log 2>&1
          npx playwright install --with-deps chromium > /tmp/playwright-install.log 2>&1

      - name: Start local site
        run: |
          python3 -m http.server 8000 > /tmp/exif-http.log 2>&1 &
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:8000/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/exif-http.log
          exit 1

      - name: Audit local and published sites
        env:
          AUDIT_LOCAL_URL: http://127.0.0.1:8000/
          AUDIT_LIVE_URL: https://abcderp2.github.io/Exif/
        run: |
          set +e
          node tests/browser-audit.mjs > /tmp/browser-audit.log 2>&1
          status=$?
          cat /tmp/browser-audit.log
          exit $status

      - name: Audit release behavior locally
        env:
          AUDIT_RELEASE_TARGET: http://127.0.0.1:8000/
        run: |
          set +e
          node tests/release-audit.mjs > /tmp/release-local-audit.log 2>&1
          status=$?
          cat /tmp/release-local-audit.log
          exit $status

      - name: Wait for Pages and audit the published release
        if: github.event_name != 'pull_request'
        env:
          AUDIT_RELEASE_TARGET: https://abcderp2.github.io/Exif/
        run: |
          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent https://abcderp2.github.io/Exif/robots.txt | grep -Fq 'User-agent: Claude-SearchBot'; then
              ready=1
              break
            fi
            sleep 10
          done
          if [ "$ready" -ne 1 ]; then
            echo "GitHub Pagesに今回の変更が反映されたことを確認できませんでした"
            exit 1
          fi
          set +e
          node tests/release-audit.mjs > /tmp/release-live-audit.log 2>&1
          status=$?
          cat /tmp/release-live-audit.log
          exit $status

      - name: Upload audit logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: browser-audit-logs
          path: /tmp/*audit.log
          retention-days: 3

name: Quality checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install locked development dependencies
        run: npm ci --ignore-scripts
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check metadata.js
          node --check reports.js
          node --check image-worker.js
          node --check tests/browser-audit.mjs
          node --check tests/release-audit.mjs
          node --check tests/accessibility-audit.mjs
      - name: Run npm verification
        run: npm run verify
      - name: Check Python syntax
        run: |
          python3 -I -m py_compile exif_remover.py
          python3 -I tests/exif_remover.test.py
      - name: Check required files and local references
        shell: bash
        run: |
          test -f index.html
          test -f styles.css
          test -f accessibility.css
          test -f app.js
          test -f metadata.js
          test -f reports.js
          test -f image-worker.js
          test -f robots.txt
          test -f ai.txt
          test -f sitemap.xml
          test -f package-lock.json
          test -f tests/release-audit.mjs
          test -f tests/accessibility-audit.mjs
          test -f tests/exif_remover.test.py
          test -f README.md
          test -f CONTRIBUTING.md
          test -f SECURITY.md
          test -f LICENSE
          grep -Fq 'styles.css' index.html
          grep -Fq 'accessibility.css' index.html
          grep -Fq 'metadata.js' index.html
          grep -Fq 'reports.js' index.html
          grep -Fq 'app.js' index.html
          grep -Fq 'image-worker.js' app.js
          grep -Fq 'id="disclaimerTitle"' index.html
          ! grep -Fq 'href="#disclaimerTitle"' index.html
          grep -Fq 'aria-label="処理する画像を選択"' index.html
          grep -Fq 'aria-describedby="uploadHelp uploadLimits"' index.html
          grep -Fq 'User-agent: OAI-SearchBot' robots.txt
          grep -Fq 'User-agent: GPTBot' robots.txt
          grep -Fq 'User-agent: Claude-User' robots.txt
          grep -Fq 'User-agent: Claude-SearchBot' robots.txt
          grep -Fq 'User-agent: ClaudeBot' robots.txt
          grep -Fq 'User-agent: Google-Extended' robots.txt
          grep -Fq 'Sitemap:' robots.txt
          ! grep -Fiq 'http-equiv="Permissions-Policy"' index.html
          grep -Fq 'href="ai.txt"' index.html

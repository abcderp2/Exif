name: Quality checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check metadata.js
          node --check reports.js
          node --check image-worker.js
          node --check tests/browser-audit.mjs
          node --check tests/release-audit.mjs
      - name: Run npm verification
        run: npm run verify
      - name: Check Python syntax
        run: python3 -m py_compile exif_remover.py
      - name: Check required files and local references
        shell: bash
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f metadata.js
          test -f reports.js
          test -f image-worker.js
          test -f robots.txt
          test -f tests/release-audit.mjs
          test -f README.md
          test -f CONTRIBUTING.md
          test -f SECURITY.md
          test -f LICENSE
          grep -Fq 'styles.css' index.html
          grep -Fq 'metadata.js' index.html
          grep -Fq 'reports.js' index.html
          grep -Fq 'app.js' index.html
          grep -Fq 'image-worker.js' app.js
          grep -Fq 'id="disclaimerTitle"' index.html
          ! grep -Fq 'href="#disclaimerTitle"' index.html
          grep -Fq 'User-agent: OAI-SearchBot' robots.txt
          grep -Fq 'User-agent: GPTBot' robots.txt
          grep -Fq 'User-agent: Claude-User' robots.txt
          grep -Fq 'User-agent: Claude-SearchBot' robots.txt
          grep -Fq 'User-agent: ClaudeBot' robots.txt
          grep -Fq 'User-agent: Google-Extended' robots.txt
